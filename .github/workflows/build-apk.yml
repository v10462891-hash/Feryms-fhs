name: Build Ferym Gram APK

on:
workflow_dispatch:
push:
branches:
- ferym-gram

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Ferym Gram
    uses: actions/checkout@v4
    with:
      ref: ferym-gram

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    run: |
      export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
      echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      echo "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
      echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

  - name: Accept Android SDK licenses
    run: |
      mkdir -p "$ANDROID_SDK_ROOT/licenses"
      yes | sdkmanager --licenses

  - name: Install Android SDK components
    run: |
      sdkmanager \
        "platform-tools" \
        "platforms;android-36" \
        "build-tools;36.0.0" \
        "ndk;27.2.12479018" \
        "cmake;3.22.1"

  - name: Prepare Gradle
    run: chmod +x ./gradlew

  - name: Build APK
    run: |
      set -o pipefail
      ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug --no-daemon --stacktrace 2>&1 | tee gradle-cloud.log

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Ferym-Gram-APK
      path: |
        TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
      if-no-files-found: error

  - name: Upload build log
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: Ferym-Gram-Build-Log
      path: gradle-cloud.log
      if-no-files-found: warn
