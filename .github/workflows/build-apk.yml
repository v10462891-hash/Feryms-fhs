name: Build Ferym Gram APK

on:
  workflow_dispatch:
  push:
    branches:
      - ferym-gram

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Ferym Gram
        uses: actions/checkout@v4
        with:
          ref: ferym-gram

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          if [ ! -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" ]; then
            echo "::error::sdkmanager not found in $SDK/cmdline-tools/16.0/bin"
            find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          echo "$SDK/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Prepare Gradle
        run: chmod +x ./gradlew

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug \
            --no-daemon --stacktrace 2>&1 | tee gradle-cloud.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ferym-Gram-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ferym-Gram-Build-Log
          path: gradle-cloud.log
          if-no-files-found: warn
